[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "staad-model-preprocessor"
dynamic = ["version"]
description = "Desktop preprocessor for cleaning structural analytical geometry before STAAD.Pro."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6",
  "pyvista",
  "pyvistaqt",
  "vtk",
  "numpy",
  "scipy",
  "ezdxf",
]

[project.optional-dependencies]
dev = [
  "Pillow",
  "pytest",
  "pytest-qt",
  "ruff",
  "mypy",
  "nuitka",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "staadprep.version.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--basetemp=.tmp/pytest"
cache_dir = ".cache/pytest"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
cache_dir = ".cache/mypy"
